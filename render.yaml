services:
  - type: web
    name: spotify-redisign-api
    runtime: node
    plan: free
    rootDir: backend/nest-server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 3d
      - key: FRONTEND_URL
        sync: false
