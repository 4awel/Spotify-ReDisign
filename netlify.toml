[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback: все маршруты отдаёт клиентский роутер
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
